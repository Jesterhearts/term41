[package]
name    = "image41"
version = "0.2.1"
edition = "2024"

[dependencies]
atoi              = "3.1.0"
base64.workspace  = true
ffmpeg-next       = { version = "9.0.0", features = ["build"], optional = true }
flate2.workspace  = true
infer.workspace   = true
libc              = "0.2.189"
log.workspace     = true
palette.workspace = true
png.workspace     = true
vtepp.workspace   = true
zune-jpeg         = "0.5.15"

[features]
default = ["ffmpeg"]
ffmpeg  = ["dep:ffmpeg-next"]
